spring:
  application:
    name: veiculos-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/projeto_veiculos}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 1800000
verification:
  storage:
    dir: ${VERIFICATION_STORAGE_DIR:private-verification-documents}
    key: ${VERIFICATION_STORAGE_KEY:}
upload:
  dir: uploads/fotos
app:
  email-change:
    enabled: ${EMAIL_CHANGE_ENABLED:false}
    from: ${EMAIL_CHANGE_FROM:}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
logging:
  level:
    org.springframework.security: INFO
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
---
spring:
  config:
    activate:
      on-profile: local & !prod
  jpa:
    hibernate:
      ddl-auto: update
