name: Auto Minas backend checks
on:
  push:
    branches: [main, feat/planos-comerciais-e-chat-privado, security/fase-1, feature/fase-2-moderacao, feature/fase-2b-veiculos, feature/fase-3-verificacoes, feature/fase-3b-verificacao-email, feature/fase-4-historico-arquivamento, feature/fase-4b-denuncias, feature/fase-5-recuperacao-senha, security/fase-5b-midia-autorizada, feature/fase-6-biometria-aws, deploy/staging-stack, feature/fase-7-anuncios-localizacao-status]
  pull_request:
    branches: [main, security/fase-1, feature/fase-2-moderacao, feature/fase-2b-veiculos, feature/fase-3-verificacoes, feature/fase-3b-verificacao-email, feature/fase-4-historico-arquivamento, feature/fase-4b-denuncias, feature/fase-5-recuperacao-senha, security/fase-5b-midia-autorizada, feature/fase-6-biometria-aws]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-test-only-password
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:13306/phase1_test
      MYSQL_TEST_USER: phase1_test_runner
      MYSQL_TEST_PASSWORD: mysql-test-runner-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Provision restricted MySQL test user
        env:
          MYSQL_PWD: mysql-test-only-password
        run: |
          mysql --protocol=TCP --host=127.0.0.1 --port=13306 --user=root <<'SQL'
          CREATE USER 'phase1_test_runner'@'%' IDENTIFIED BY 'mysql-test-runner-only-password';
          GRANT ALL PRIVILEGES ON `phase1\_test\_%`.* TO 'phase1_test_runner'@'%';
          SQL
      - run: ./mvnw -B clean verify
